<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>✦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #22062b 0%, #0c0212 55%, #020005 100%);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Кинематографичный шум */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* Мощная световая вспышка */
    .flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 200, 230, 0.85), rgba(255, 30, 100, 0.35) 40%, transparent 75%);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .flash.active {
      opacity: 1;
      transition: opacity 0.08s ease-out;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: pointer;
    }

    /* Интерактивная подсказка */
    .hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 7vh;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .hint.hidden {
      opacity: 0;
      transform: translateY(15px);
    }

    .hint-ring {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 160, 200, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: ringPulse 2s ease-in-out infinite;
      box-shadow: 0 0 15px rgba(255, 77, 121, 0.4);
    }

    .hint-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff7597;
      box-shadow: 0 0 12px #ff2e63;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    .hint-label {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255, 225, 238, 0.8);
      text-shadow: 0 0 10px rgba(255, 50, 100, 0.5);
    }

    /* Блок текста */
    .reveal-layer {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .reveal-layer.visible {
      opacity: 1;
    }

    .reveal-content {
      position: relative;
      max-width: 700px;
      width: 100%;
      text-align: center;
      padding: 40px 20px;
    }

    .reveal-content::before {
      content: '';
      position: absolute;
      inset: -40px -25px;
      background: radial-gradient(ellipse at center, rgba(15, 2, 22, 0.85) 0%, rgba(10, 2, 14, 0.4) 55%, transparent 80%);
      z-index: -1;
      pointer-events: none;
    }

    .flare-line {
      height: 1.5px;
      width: 0;
      margin: 0 auto;
      background: linear-gradient(90deg, transparent, rgba(255, 180, 210, 0.9), #fff, rgba(255, 180, 210, 0.9), transparent);
      box-shadow: 0 0 20px rgba(255, 100, 130, 0.8);
      transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
    }

    .reveal-layer.visible .flare-line {
      width: min(280px, 70vw);
    }

    .message-title {
      margin: 28px 0 16px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(38px, 7.5vw, 70px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, #ffffff 10%, #ffe6ed 45%, #ff5c8a 75%, #ffffff 95%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(255, 77, 121, 0.5));
      transform: scale(0.85) translateY(20px);
      opacity: 0;
      transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s, opacity 1s ease 0.15s;
      animation: textShine 5s linear infinite;
    }

    .reveal-layer.visible .message-title {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    @keyframes textShine {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    .message-subtitle {
      margin-bottom: 28px;
      font-size: clamp(14px, 2.3vw, 17px);
      font-weight: 300;
      letter-spacing: 0.1em;
      line-height: 1.7;
      color: rgba(255, 232, 242, 0.85);
      text-shadow: 0 0 12px rgba(255, 100, 150, 0.4);
      transform: translateY(15px);
      opacity: 0;
      transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s, opacity 1s ease 0.3s;
    }

    .reveal-layer.visible .message-subtitle {
      transform: translateY(0);
      opacity: 1;
    }

    /* Кнопка переключения / далее */
    .next-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 5;
      padding: 12px 22px;
      border-radius: 30px;
      border: 1px solid rgba(255, 180, 210, 0.35);
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255, 230, 242, 0.9);
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.05);
      transition: opacity 0.6s ease 0.4s, transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
    }

    .next-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .next-btn:hover {
      border-color: rgba(255, 140, 175, 0.8);
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="flash" id="flash"></div>
  <canvas id="scene"></canvas>

  <div class="hint" id="hint">
    <div class="hint-ring"><div class="hint-dot"></div></div>
    <span class="hint-label">Нажми на сердце</span>
  </div>

  <div class="reveal-layer" id="revealLayer">
    <div class="reveal-content">
      <div class="flare-line"></div>
      <h1 class="message-title" id="msgTitle"></h1>
      <p class="message-subtitle" id="msgSubtitle"></p>
      <div class="flare-line"></div>
    </div>
  </div>

  <button class="next-btn" id="nextBtn">Ещё ✦</button>

  <script>
    // ==========================================
    // ✍️ ТЕКСТЫ (добавляй сколько угодно)
    // ==========================================
    const messages = [
      {
        title: "твои губы такие нежные",
        subtitle: "сделай минчик) ✦"
      },
      {
        title: "можно и просто дать",
        subtitle: "с хорошим окончанием ✨"
      },
      {
        title: "ну от первого не откажусь",
        subtitle: "можно и совместить)) 🤍"
      }
    ];

    let currentMsgIndex = 0;

    function updateTextContent() {
      const current = messages[currentMsgIndex];
      document.getElementById('msgTitle').textContent = current.title;
      document.getElementById('msgSubtitle').textContent = current.subtitle;
    }

    updateTextContent();
    // ==========================================

    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('hint');
    const revealLayer = document.getElementById('revealLayer');
    const flash = document.getElementById('flash');
    const nextBtn = document.getElementById('nextBtn');

    let width, height, dpr, scaleUnit;
    let state = 'heart'; // 'heart' | 'exploding' | 'revealed'
    let stateTime = 0;

    let rotY = 0;
    let targetTiltX = 0;
    let targetTiltY = 0;
    let tiltX = 0;
    let tiltY = 0;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      scaleUnit = Math.min(width, height) / 48;
    }

    window.addEventListener('resize', resize);
    resize();

    // 💥 МАКСИМАЛЬНО МОЩНАЯ ВИБРАЦИЯ ТЕЛЕФОНА
    function triggerStrongVibration() {
      try {
        if (navigator.vibrate) {
          // Интенсивный паттерн: мощный удар, пауза, серия дрожаний
          navigator.vibrate([70, 40, 120, 50, 200]);
        }
      } catch (e) {}
    }

    // Очень нежный, волшебный звон колокольчиков
    function playMagicChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const audio = new AudioCtx();
        const freqs = [587.33, 739.99, 880.00, 1174.66, 1479.98];
        freqs.forEach((f, i) => {
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, audio.currentTime + i * 0.05);
          gain.gain.setValueAtTime(0.0001, audio.currentTime + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.025, audio.currentTime + i * 0.05 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + i * 0.05 + 2.2);
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start(audio.currentTime + i * 0.05);
          osc.stop(audio.currentTime + i * 0.05 + 2.3);
        });
      } catch (e) {}
    }

    const HEART_COUNT = width < 600 ? 900 : 1300;
    const colors = ['#ff2e63', '#ff5c8a', '#ff8fa3', '#ffd6e0', '#ffffff', '#ff99c8', '#fc4445'];
    const heartParticles = [];

    function createHeartParticles() {
      heartParticles.length = 0;
      for (let i = 0; i < HEART_COUNT; i++) {
        const t = Math.random() * Math.PI * 2;
        const isShell = Math.random() < 0.4;
        const r = isShell ? 0.92 + Math.random() * 0.1 : Math.pow(Math.random(), 0.5) * 0.92;

        const hx = 16 * Math.pow(Math.sin(t), 3) * r;
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * r;
        const maxZ = 9 * Math.sqrt(Math.max(0.05, 1 - r * r * 0.7));
        const hz = (Math.random() * 2 - 1) * maxZ;

        const orbitAngle = Math.random() * Math.PI * 2;
        const orbitRadius = 16 + Math.random() * 30;
        const orbitY = (Math.random() - 0.5) * 26;

        heartParticles.push({
          hx, hy, hz,
          x: hx, y: hy, z: hz,
          vx: 0, vy: 0, vz: 0,
          orbitAngle,
          orbitRadius,
          orbitY,
          orbitSpeed: (Math.random() * 0.005 + 0.002) * (Math.random() > 0.5 ? 1 : -1),
          isOrbitStar: i % 3 !== 0,
          size: isShell ? Math.random() * 2.1 + 1.2 : Math.random() * 2.6 + 0.9,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: isShell ? Math.random() * 0.35 + 0.65 : Math.random() * 0.5 + 0.3,
          twinklePhase: Math.random() * Math.PI * 2
        });
      }
    }

    createHeartParticles();

    // Красивая глубокая космическая пыль
    const bgStars = Array.from({ length: 120 }, () => ({
      x: (Math.random() - 0.5) * 1800,
      y: (Math.random() - 0.5) * 1800,
      z: Math.random() * 1000 + 50,
      size: Math.random() * 1.8 + 0.4,
      alpha: Math.random() * 0.6 + 0.2
    }));

    const bursts = [];
    const shockwaves = [];

    function spawnTapBurst(screenX, screenY, amount = 32) {
      triggerStrongVibration();
      for (let i = 0; i < amount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 2;
        bursts.push({
          x: screenX,
          y: screenY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          size: Math.random() * 3.5 + 1.2,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.016 + 0.01
        });
      }
      shockwaves.push({
        x: screenX,
        y: screenY,
        r: 10,
        maxR: Math.min(width, height) * 0.4,
        alpha: 0.85
      });
    }

    // Мгновенный взрыв сердца и появление текста в тот же миг
    function triggerExplosion() {
      if (state !== 'heart') return;
      state = 'exploding';
      stateTime = 0;
      
      hint.classList.add('hidden');
      playMagicChime();
      triggerStrongVibration();

      // Текст и вспышка появляются СРАЗУ же
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 200);

      revealLayer.classList.add('visible');
      nextBtn.classList.add('visible');

      shockwaves.push(
        { x: width / 2, y: height / 2, r: 10, maxR: Math.max(width, height) * 0.75, alpha: 0.95 },
        { x: width / 2, y: height / 2, r: 10, maxR: Math.max(width, height) * 0.5, alpha: 0.7 }
      );

      for (const p of heartParticles) {
        const len = Math.hypot(p.x, p.y, p.z) || 1;
        const power = Math.random() * 1.8 + 0.8;
        p.vx = (p.x / len) * power + (Math.random() - 0.5) * 0.5;
        p.vy = (p.y / len) * power + (Math.random() - 0.5) * 0.5;
        p.vz = (p.z / len) * power + (Math.random() - 0.5) * 0.5;
      }

      setTimeout(() => {
        state = 'revealed';
      }, 350);
    }

    // Переход к следующему тексту и сборка нового сердца
    function nextMessage(e) {
      if (e) e.stopPropagation();
      if (state === 'heart' || state === 'exploding') return;

      triggerStrongVibration();
      playMagicChime();

      revealLayer.classList.remove('visible');
      nextBtn.classList.remove('visible');

      // Переключаем текст
      currentMsgIndex = (currentMsgIndex + 1) % messages.length;
      updateTextContent();

      state = 'heart';
      stateTime = 0;
      createHeartParticles();
      setTimeout(() => hint.classList.remove('hidden'), 400);
    }

    nextBtn.addEventListener('click', nextMessage);

    window.addEventListener('mousemove', (e) => {
      targetTiltY = ((e.clientX / width) - 0.5) * 0.7;
      targetTiltX = ((e.clientY / height) - 0.5) * -0.5;
    });

    canvas.addEventListener('click', (e) => {
      if (state === 'heart') {
        triggerExplosion();
      } else if (state === 'revealed') {
        // Клик в режиме открытки делает фейерверк и переключает на следующий текст
        spawnTapBurst(e.clientX, e.clientY, 35);
        nextMessage(e);
      }
    });

    let lastTime = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastTime) / 16.67, 2.5);
      lastTime = now;
      stateTime += dt;

      ctx.clearRect(0, 0, width, height);

      tiltX += (targetTiltX - tiltX) * 0.06;
      tiltY += (targetTiltY - tiltY) * 0.06;
      rotY += (state === 'heart' ? 0.009 : 0.0025) * dt;

      const cx = width / 2;
      const cy = height / 2;
      const fov = 55;

      ctx.globalCompositeOperation = 'lighter';

      // 1. Космические звёзды с мерцанием
      for (const s of bgStars) {
        s.z -= 0.5 * dt;
        if (s.z < 10) s.z = 1000;
        const proj = 350 / s.z;
        const sx = cx + s.x * proj;
        const sy = cy + s.y * proj;
        if (sx < -20 || sx > width + 20 || sy < -20 || sy > height + 20) continue;

        ctx.globalAlpha = s.alpha * Math.min(1, (1000 - s.z) / 300);
        ctx.fillStyle = '#ffd6e0';
        ctx.beginPath();
        ctx.arc(sx, sy, s.size * proj, 0, Math.PI * 2);
        ctx.fill();
      }

      // 2. Сердцебиение
      const tSec = now * 0.001;
      const beat =
        1 +
        0.08 * Math.pow(Math.max(0, Math.sin(tSec * 2.8)), 8) +
        0.05 * Math.pow(Math.max(0, Math.sin(tSec * 2.8 - 0.55)), 8);

      const angleY = rotY + tiltY;
      const angleX = tiltX;
      const cosY = Math.cos(angleY);
      const sinY = Math.sin(angleY);
      const cosX = Math.cos(angleX);
      const sinX = Math.sin(angleX);

      // 3. Частицы сердца
      for (const p of heartParticles) {
        p.twinklePhase += 0.06 * dt;

        if (state === 'heart') {
          const tx = p.hx * beat;
          const ty = (p.hy + 1.2) * beat;
          const tz = p.hz * beat;

          p.x += (tx - p.x) * 0.18 * dt;
          p.y += (ty - p.y) * 0.18 * dt;
          p.z += (tz - p.z) * 0.18 * dt;
        } else if (state === 'exploding') {
          p.vx *= 0.95;
          p.vy *= 0.95;
          p.vz *= 0.95;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.z += p.vz * dt;
        } else if (state === 'revealed') {
          if (p.isOrbitStar) {
            p.orbitAngle += p.orbitSpeed * dt;
            const targetX = Math.cos(p.orbitAngle) * p.orbitRadius;
            const targetZ = Math.sin(p.orbitAngle) * p.orbitRadius;
            const targetY = p.orbitY + Math.sin(p.orbitAngle * 2) * 3;

            p.vx *= 0.9;
            p.vy *= 0.9;
            p.vz *= 0.9;

            p.x += p.vx * dt + (targetX - p.x) * 0.03 * dt;
            p.y += p.vy * dt + (targetY - p.y) * 0.03 * dt;
            p.z += p.vz * dt + (targetZ - p.z) * 0.03 * dt;
          } else {
            p.vx *= 0.95;
            p.vy *= 0.95;
            p.vz *= 0.95;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.z += p.vz * dt;
            p.alpha *= 0.94;
          }
        }

        if (p.alpha < 0.01) continue;

        const x1 = p.x * cosY - p.z * sinY;
        const z1 = p.z * cosY + p.x * sinY;
        const y2 = p.y * cosX - z1 * sinX;
        const z2 = z1 * cosX + p.y * sinX;

        const perspective = fov / (fov + z2);
        if (perspective <= 0) continue;

        const screenX = cx + x1 * scaleUnit * perspective;
        const screenY = cy + y2 * scaleUnit * perspective;
        const radius = Math.max(0.4, p.size * perspective * (width < 600 ? 0.9 : 1.1));
        const twinkle = 0.7 + 0.3 * Math.sin(p.twinklePhase);

        ctx.globalAlpha = Math.min(1, p.alpha * twinkle);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(screenX, screenY, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // 4. Ударные волны
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += (sw.maxR - sw.r) * 0.09 * dt + 2.5;
        sw.alpha *= 0.92;
        if (sw.alpha < 0.01) {
          shockwaves.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = sw.alpha;
        ctx.strokeStyle = '#ff99b8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 5. Салюты при кликах
      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.vx *= 0.95;
        b.vy = b.vy * 0.95 + 0.05;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.alpha -= b.decay * dt;
        if (b.alpha <= 0) {
          bursts.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = b.alpha;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
